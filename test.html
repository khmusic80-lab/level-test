<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>경희실용음악학원 - 레벨 테스트 평가</title>
    <link rel="stylesheet" href="assets/css/common.css">
    <style>
        .card { max-width: 520px; padding: 50px 40px; }

        .header-tag { font-size: 13px; letter-spacing: 1px; }

        .card h2 { margin-bottom: 10px; }

        .student-info-box {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 35px;
            font-weight: 700;
            border: 1px solid var(--border-color);
        }

        #dynamic-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 25px;
        }

        .field { margin-bottom: 0; }

        /* 항목명: 배경 없이 파란색 글씨로만 강조 */
        .field label {
            font-size: 14px;
            color: var(--accent-text);
            margin-bottom: 8px;
            font-weight: 800;
        }

        .field input { font-weight: 600; }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .progress-text { margin-top: 28px; font-size: 13px; font-weight: 700; color: var(--muted-color); }
        .progress-text.complete { color: var(--accent-text); }

        .btn-group { margin-top: 16px; }
        #submit-btn { padding: 16px; font-size: 16px; }

        @media (max-width: 480px) {
            .card { padding: 32px 20px; }
            #dynamic-fields { gap: 16px; }
        }
    </style>
</head>
<body class="centered" hidden>

<div class="card">
    <div class="header-tag">LEVEL TEST</div>
    <h2 id="title">테스트 결과 입력</h2>
    <div id="display-info" class="student-info-box"></div>

    <form id="score-form" novalidate>
        <div id="dynamic-fields"></div>
        <div id="progress" class="progress-text" aria-live="polite"></div>
        <div class="btn-group">
            <button type="submit" id="submit-btn" class="btn btn-primary">최종 리포트 생성하기</button>
            <button type="button" id="back-btn" class="btn btn-outline">← 학생 정보 수정</button>
        </div>
    </form>
</div>

<script type="module">
import { requireAuth } from './assets/js/firebase.js';
import { getReport, updateReport } from './assets/js/reports.js';
import { getFields, minScore } from './assets/js/fields.js';
import { escapeHtml, isValidScore, calcAverage, loadDraft, saveDraft, setFieldError, toast } from './assets/js/utils.js';

await requireAuth();

const $ = id => document.getElementById(id);

// 저장된 리포트의 점수 수정 모드: result.html의 "점수 다시 입력"(?id=)
// 또는 첫 저장 후 브라우저 뒤로가기로 돌아온 경우(임시 데이터에 reportId만 남아 있음)
const draft = loadDraft();
const editId = new URLSearchParams(location.search).get('id') || draft?.reportId || null;

if (editId) {
    let report = null;
    try {
        report = await getReport(editId);
    } catch (err) {
        alert("리포트를 불러오지 못했습니다: " + err.message);
    }
    if (report) init(report.name, report.major, report.scores);
    else location.replace("admin.html");
} else if (draft?.name) {
    init(draft.name, draft.major, draft.scoreInput ?? draft.scores);
} else {
    alert("인적사항 데이터가 없습니다. 첫 페이지로 이동합니다.");
    location.replace("index.html");
}

function init(name, major, initialScores) {
    $('display-info').textContent = `${name} 학생 · ${major}`;
    if (editId) {
        document.title = "경희실용음악학원 - 점수 수정";
        $('title').textContent = "점수 수정";
        $('submit-btn').textContent = "점수 저장하고 리포트 보기";
        $('back-btn').textContent = "← 리포트로 돌아가기";
    }

    // 저장된 리포트 수정 시에는 그 리포트의 항목 그대로, 새 입력은 현재 항목으로
    const fields = getFields(major, editId ? initialScores : undefined);
    const min = minScore(fields);
    const inputOf = f => $(`score-${f.key}`);

    $('dynamic-fields').innerHTML = fields.map(f => `
        <div class="field">
            <label for="score-${f.key}">${escapeHtml(f.label)}</label>
            <input type="number" id="score-${f.key}" min="${min}" max="100" inputmode="decimal" placeholder="${min}~100" enterkeyhint="next">
        </div>
    `).join('');

    // 이전에 입력했던 점수 복원
    fields.forEach(f => {
        if (initialScores?.[f.key] != null) inputOf(f).value = initialScores[f.key];
    });
    const initialValues = JSON.stringify(fields.map(f => inputOf(f).value));
    inputOf(fields.at(-1)).setAttribute('enterkeyhint', 'done');

    // 빈 값이면 '', 잘못된 값이면 오류 문구, 정상이면 null
    const problemOf = input => {
        const raw = input.value.trim();
        if (raw === '') return '';
        return isValidScore(Number(raw), min) ? null : `${min}~100 사이로 입력하세요.`;
    };

    function updateProgress() {
        const done = fields.filter(f => problemOf(inputOf(f)) === null);
        const scores = Object.fromEntries(done.map(f => [f.key, Number(inputOf(f).value)]));
        $('progress').textContent = done.length === fields.length
            ? `${fields.length}개 항목 입력 완료 · 평균 ${calcAverage(scores, fields).toFixed(1)}점`
            : `${done.length} / ${fields.length} 항목 입력`;
        $('progress').classList.toggle('complete', done.length === fields.length);
    }

    fields.forEach((f, i) => {
        const input = inputOf(f);
        // 입력하는 동안: 범위를 벗어나면 바로 알려주고, 고치면 바로 지움
        input.addEventListener('input', () => {
            setFieldError(input, problemOf(input) || '');
            updateProgress();
        });
        // Enter: 다음 칸으로 이동, 마지막 칸에서는 제출
        input.addEventListener('keydown', e => {
            if (e.key !== 'Enter' || e.isComposing || i === fields.length - 1) return;
            e.preventDefault();
            inputOf(fields[i + 1]).focus();
        });
    });
    updateProgress();

    // 지금까지 입력한 값 (빈칸·잘못된 값은 제외)
    const currentInput = () => Object.fromEntries(fields
        .filter(f => problemOf(inputOf(f)) === null)
        .map(f => [f.key, Number(inputOf(f).value)]));

    $('back-btn').addEventListener('click', () => {
        if (editId) {
            const changed = JSON.stringify(fields.map(f => inputOf(f).value)) !== initialValues;
            if (changed && !confirm("수정한 점수가 저장되지 않습니다. 리포트로 돌아갈까요?")) return;
            location.href = `result.html?id=${encodeURIComponent(editId)}`;
        } else {
            // 입력하던 점수는 임시 저장해 두고 학생 정보 화면으로
            saveDraft({ ...loadDraft(), scoreInput: currentInput() });
            location.href = "index.html?resume";
        }
    });

    $('score-form').addEventListener('submit', async e => {
        e.preventDefault();
        let firstInvalid = null;
        for (const f of fields) {
            const input = inputOf(f);
            const problem = problemOf(input);
            if (problem === null) continue;
            setFieldError(input, problem || '점수를 입력하세요.');
            firstInvalid ??= input;
        }
        if (firstInvalid) {
            firstInvalid.focus();
            return;
        }

        const scores = currentInput();
        if (!editId) {
            const { scoreInput, ...rest } = loadDraft();
            saveDraft({ ...rest, scores });
            location.href = "result.html";
            return;
        }

        const btn = $('submit-btn');
        btn.disabled = true;
        btn.textContent = "저장 중...";
        try {
            await updateReport(editId, { scores, average_score: calcAverage(scores, fields) });
            location.href = `result.html?id=${encodeURIComponent(editId)}`;
        } catch (err) {
            toast("저장 실패: " + err.message, 'error');
            btn.disabled = false;
            btn.textContent = "점수 저장하고 리포트 보기";
        }
    });
}
</script>

</body>
</html>
