<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>경희실용음악학원 - 레벨 테스트 평가</title>
    <link rel="stylesheet" href="assets/css/common.css">
    <style>
        .card { max-width: 520px; padding: 50px 40px; }

        .header-tag { font-size: 13px; letter-spacing: 1px; }

        .card h2 { margin-bottom: 10px; }

        .student-info-box {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 35px;
            font-weight: 700;
            border: 1px solid var(--border-color);
        }

        #dynamic-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 25px;
        }

        .field { margin-bottom: 0; }

        /* 항목명: 배경 없이 파란색 글씨로만 강조 */
        .field label {
            font-size: 14px;
            color: var(--accent-color);
            margin-bottom: 8px;
            font-weight: 800;
        }

        .field input { font-weight: 600; }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        #submit-btn { margin-top: 40px; padding: 16px; font-size: 16px; }

        @media (max-width: 480px) {
            .card { padding: 32px 20px; }
            #dynamic-fields { gap: 16px; }
        }
    </style>
</head>
<body class="centered" hidden>

<div class="card">
    <div class="header-tag">LEVEL TEST</div>
    <h2>테스트 결과 입력</h2>
    <div id="display-info" class="student-info-box"></div>

    <div id="dynamic-fields"></div>

    <button type="button" id="submit-btn" class="btn btn-primary">최종 리포트 생성하기</button>
    <div class="footer-text">각 항목은 0~100점 사이로 평가해 주세요.</div>
</div>

<script type="module">
import { requireAuth } from './assets/js/firebase.js';
import { getFields } from './assets/js/fields.js';
import { escapeHtml, isValidScore, loadDraft, saveDraft } from './assets/js/utils.js';

await requireAuth();

const draft = loadDraft();
if (!draft) {
    alert("인적사항 데이터가 없습니다. 첫 페이지로 이동합니다.");
    location.replace("index.html");
} else {
    init(draft);
}

function init(draft) {
    document.getElementById('display-info').textContent = `${draft.name} 학생 · ${draft.major}`;

    const fields = getFields(draft.major);
    const inputOf = f => document.getElementById(`score-${f.key}`);

    document.getElementById('dynamic-fields').innerHTML = fields.map(f => `
        <div class="field">
            <label for="score-${f.key}">${escapeHtml(f.label)}</label>
            <input type="number" id="score-${f.key}" min="0" max="100" inputmode="decimal" placeholder="점수 입력">
        </div>
    `).join('');

    // 결과 화면에서 뒤로 왔을 때 입력했던 점수 복원
    if (draft.scores) {
        fields.forEach(f => {
            if (draft.scores[f.key] != null) inputOf(f).value = draft.scores[f.key];
        });
    }

    document.getElementById('submit-btn').addEventListener('click', () => {
        const scores = {};
        let hasEmpty = false;

        for (const f of fields) {
            const input = inputOf(f);
            const raw = input.value.trim();
            if (raw === '') {
                hasEmpty = true;
                scores[f.key] = 0;
                continue;
            }
            const n = Number(raw);
            if (!isValidScore(n)) {
                alert(`[${f.label}] 0~100 사이의 숫자를 입력해 주세요.`);
                input.focus();
                return;
            }
            scores[f.key] = n;
        }

        if (hasEmpty && !confirm("입력되지 않은 항목이 있습니다. 0점으로 처리하고 진행할까요?")) return;

        saveDraft({ ...draft, scores });
        location.href = "result.html";
    });
}
</script>

</body>
</html>
