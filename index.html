<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>경희실용음악학원 - 입시 리포트 시스템</title>
    <link rel="stylesheet" href="assets/css/common.css">
</head>
<body class="centered" hidden>

<div class="card">
    <div class="header-tag">KYUNGHEE MUSIC</div>
    <h2>입시 분석 시스템</h2>

    <form id="client-form">
        <div class="field">
            <label for="name">내담자 이름</label>
            <input type="text" id="name" maxlength="50" placeholder="학생 성명을 입력하세요">
        </div>

        <div class="field">
            <label for="age">나이 / 학년</label>
            <input type="text" id="age" maxlength="30" placeholder="예: 18세 (고2)">
        </div>

        <div class="field">
            <label for="major">지원 전공</label>
            <select id="major">
                <option value="">전공을 선택하세요</option>
            </select>
        </div>

        <div class="field">
            <label for="target-school">목표 학교 (지망 대학)</label>
            <input type="text" id="target-school" maxlength="100" placeholder="예: 서울예대, 동아방송대">
        </div>

        <div class="field">
            <label for="date">분석 일시</label>
            <input type="date" id="date">
        </div>

        <div class="btn-group">
            <button type="submit" class="btn btn-primary">레벨 테스트 시작하기</button>
            <button type="button" id="admin-btn" class="btn btn-outline">📋 리포트 대시보드 관리</button>
        </div>
    </form>

    <div class="footer-text">
        © KYUNGHEE MUSIC ACADEMY · <button type="button" id="logout-btn" class="link-btn">로그아웃</button>
    </div>
</div>

<script type="module">
import { requireAuth, logout } from './assets/js/firebase.js';
import { MAJORS } from './assets/js/fields.js';
import { todayLocal, saveDraft } from './assets/js/utils.js';

await requireAuth();

const $ = id => document.getElementById(id);

MAJORS.forEach(m => $('major').add(new Option(m, m)));
$('date').value = todayLocal();

$('client-form').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('name').value.trim();
    const major = $('major').value;

    if (!name || !major) {
        alert("이름과 전공은 필수 입력 사항입니다.");
        return;
    }

    // 새 학생 입력이므로 이전 임시 데이터(점수 포함)는 통째로 교체
    saveDraft({
        name,
        age: $('age').value.trim() || "미입력",
        major,
        targetSchool: $('target-school').value.trim() || "미입력",
        date: $('date').value || todayLocal()
    });
    location.href = "test.html";
});

$('admin-btn').addEventListener('click', () => location.href = 'admin.html');
$('logout-btn').addEventListener('click', logout);
</script>

</body>
</html>
