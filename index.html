<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>경희실용음악학원 - 입시 리포트 시스템</title>
    <link rel="stylesheet" href="assets/css/common.css">
</head>
<body class="centered" hidden>

<div class="card">
    <div class="header-tag">KYUNGHEE MUSIC</div>
    <h2>입시 분석 시스템</h2>

    <form id="client-form" novalidate>
        <div class="field">
            <label for="name">학생 이름<span class="required">*</span></label>
            <input type="text" id="name" maxlength="50" placeholder="학생 성명을 입력하세요">
        </div>

        <div class="field">
            <label for="age">나이 / 학년</label>
            <input type="text" id="age" maxlength="30" placeholder="예: 18세 (고2)">
        </div>

        <div class="field">
            <label for="major">지원 전공<span class="required">*</span></label>
            <select id="major">
                <option value="">전공을 선택하세요</option>
            </select>
        </div>

        <div class="field">
            <label for="target-school">목표 학교 (지망 대학)</label>
            <input type="text" id="target-school" maxlength="100" placeholder="예: 서울예대, 동아방송대">
        </div>

        <div class="field">
            <label for="date">분석 일시</label>
            <input type="date" id="date">
        </div>

        <div class="btn-group">
            <button type="submit" class="btn btn-primary">레벨 테스트 시작하기</button>
            <button type="button" id="admin-btn" class="btn btn-outline">📋 리포트 대시보드 관리</button>
        </div>
    </form>

    <div class="footer-text">
        © KYUNGHEE MUSIC ACADEMY · <button type="button" id="logout-btn" class="link-btn">로그아웃</button>
    </div>
</div>

<script type="module">
import { requireAuth, logout } from './assets/js/firebase.js';
import { MAJORS } from './assets/js/fields.js';
import { todayLocal, blankIfUnset, loadDraft, saveDraft, setFieldError } from './assets/js/utils.js';

await requireAuth();

const $ = id => document.getElementById(id);

MAJORS.forEach(m => $('major').add(new Option(m, m)));
$('date').value = todayLocal();

// 점수 입력 화면에서 "학생 정보 수정"으로 돌아온 경우(?resume): 입력했던 값을 다시 채움
const resume = new URLSearchParams(location.search).has('resume');
const prev = loadDraft();
const resuming = resume && prev?.name && !prev.reportId;
if (resuming) {
    $('name').value = prev.name;
    $('age').value = blankIfUnset(prev.age);
    $('major').value = prev.major ?? "";
    $('target-school').value = blankIfUnset(prev.targetSchool);
    $('date').value = prev.date || todayLocal();
}

$('name').addEventListener('input', () => setFieldError($('name'), ''));
$('major').addEventListener('change', () => setFieldError($('major'), ''));

$('client-form').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('name').value.trim();
    const major = $('major').value;

    setFieldError($('name'), name ? '' : '학생 이름을 입력하세요.');
    setFieldError($('major'), major ? '' : '지원 전공을 선택하세요.');
    if (!name) return $('name').focus();
    if (!major) return $('major').focus();

    const draft = {
        name,
        age: $('age').value.trim(),
        major,
        targetSchool: $('target-school').value.trim(),
        date: $('date').value || todayLocal()
    };
    if (resuming) {
        // 정보만 고치러 온 경우 작성 중이던 내용 유지. 전공이 바뀌면 평가 항목이 달라지므로 점수는 버림
        if (prev.major === major) {
            draft.scores = prev.scores;
            draft.scoreInput = prev.scoreInput;
        }
        draft.improvement = prev.improvement;
        draft.finalComment = prev.finalComment;
    }
    // 그 외(새 학생)에는 이전 임시 데이터(점수 포함)를 통째로 교체
    saveDraft(draft);
    location.href = "test.html";
});

$('admin-btn').addEventListener('click', () => location.href = 'admin.html');
$('logout-btn').addEventListener('click', logout);
</script>

</body>
</html>
