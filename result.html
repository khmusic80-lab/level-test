<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>경희실용음악 입시 리포트</title>
    <link rel="stylesheet" href="assets/css/common.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
    <style>
        body { line-height: 1.6; }

        .container { max-width: 900px; margin: 40px auto; padding: 60px; background: white; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border-radius: 8px; }

        /* 헤더 디자인 */
        .report-header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 3px solid var(--primary-color); padding-bottom: 15px; margin-bottom: 40px; }
        .report-header h1 { margin: 0; font-size: 32px; font-weight: 900; letter-spacing: -1px; }
        .sub-title { font-size: 14px; color: var(--muted-color); font-weight: 600; }
        .header-right { text-align: right; font-size: 14px; color: var(--muted-color); }

        /* 테이블 스타일 */
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; table-layout: fixed; }
        th { background: #f1f4f7; color: #34495e; font-weight: 700; font-size: 13px; padding: 12px; border: 1px solid var(--border-color); }
        td { padding: 12px; text-align: center; border: 1px solid var(--border-color); font-size: 15px; }
        .info-label { background: #f9f9f9; font-weight: 700; width: 100px; color: var(--primary-color); }
        .th-dark { background: var(--primary-color); color: white; }
        .th-left { text-align: left; padding-left: 20px; }

        .info-input {
            width: 100%; border: none; background: transparent !important;
            font-size: 16px; text-align: center; font-weight: 600; outline: none; color: inherit;
        }
        .info-input.left { text-align: left; padding-left: 15px; }

        .avg-score { font-weight: 800; color: var(--danger-color); font-size: 1.6em; }
        #score-row { font-weight: 800; color: var(--accent-color); }

        /* 텍스트 영역 */
        textarea {
            width: 100%; padding: 20px; border: 1px solid var(--border-color); font-size: 15px;
            line-height: 1.8; resize: none; height: 180px; background: #fff; outline: none;
            transition: all 0.3s;
        }
        textarea:focus { border: 1px solid var(--accent-color); background: #fcfdfe; }

        .print-text-area { display: none; text-align: left; padding: 20px; font-size: 15px; line-height: 1.8; white-space: pre-wrap; word-break: break-all; min-height: 150px; border: 1px solid var(--border-color); }

        /* 차트 레이아웃 */
        #charts { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin: 30px 0; }
        .chart-box { text-align: center; flex: 1; min-width: 240px; }
        canvas { max-width: 280px !important; max-height: 280px !important; margin: 0 auto; }

        .recommend-cell { padding: 20px; text-align: left; background: #fafafa; }
        .artist-tag { display: inline-block; background: #f1f2f6; color: #2f3542; padding: 6px 12px; border-radius: 4px; font-size: 13px; font-weight: 600; margin: 3px; border: 1px solid #dfe4ea; }

        .academy-sign { text-align: center; margin-top: 50px; font-weight: 800; font-size: 20px; letter-spacing: 2px; }

        /* 버튼 설정 */
        .button-group { margin-top: 40px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .button-group button { padding: 15px 30px; border: none; color: white; border-radius: 10px; font-size: 15px; cursor: pointer; font-weight: 700; transition: 0.2s; }
        .button-group button:hover:not(:disabled) { opacity: 0.8; transform: translateY(-1px); }
        .button-group button:disabled { opacity: 0.6; cursor: default; }
        #back-btn { background: #95a5a6; }
        #save-only-btn { background: var(--accent-color); flex: 1; max-width: 200px; }
        #save-print-btn { background: #2ecc71; flex: 1; max-width: 250px; }

        @media (max-width: 700px) {
            .container { margin: 0; padding: 24px 16px; border-radius: 0; }
            .report-header h1 { font-size: 24px; }
            .info-label { width: 70px; }
            th, td { padding: 8px 4px; font-size: 13px; }
        }

        @media print {
            @page { margin: 15mm; }
            body { background: white; padding: 0; }
            .container { box-shadow: none; margin: 0; padding: 0; width: 100%; max-width: none; }
            .no-print { display: none !important; }
            textarea { display: none !important; }
            .print-text-area { display: block !important; }
            .recommend-section { page-break-before: always; margin-top: 50px; }
            th, .info-label { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body hidden>

<div class="container">
    <div class="report-header">
        <div>
            <div class="sub-title">KYUNGHEE MUSIC ACADEMY</div>
            <h1>입시 분석 리포트</h1>
        </div>
        <div class="header-right">Evaluation Report</div>
    </div>

    <table>
        <tr>
            <td class="info-label">성 명</td><td><input type="text" id="disp-name" class="info-input" readonly></td>
            <td class="info-label">전 공</td><td><input type="text" id="disp-major" class="info-input" readonly></td>
        </tr>
        <tr>
            <td class="info-label">나 이</td><td><input type="text" id="disp-age" class="info-input" readonly></td>
            <td class="info-label">분석일시</td><td><input type="text" id="disp-date" class="info-input" readonly></td>
        </tr>
    </table>

    <div id="charts">
        <div class="chart-box"><h3>[ 능력치 분석 데이터 ]</h3><canvas id="myChart"></canvas></div>
        <div class="chart-box"><h3 id="avg-title">[ 전공 평균 데이터 ]</h3><canvas id="avgChart"></canvas></div>
    </div>

    <table>
        <tr><th colspan="4" class="th-dark">종합 평가 지표</th></tr>
        <tr>
            <td class="info-label">목표 학교</td>
            <td><input type="text" id="target-school" class="info-input left" readonly></td>
            <td class="info-label">평균 점수</td>
            <td class="avg-score"><span id="avg">0.0</span></td>
        </tr>
    </table>

    <table>
        <tr id="score-header"></tr>
        <tr id="score-row"></tr>
    </table>

    <div class="recommend-section">
        <table>
            <tr><th class="th-dark th-left">추천 입시곡 및 아티스트 가이드</th></tr>
            <tr><td class="recommend-cell"><div id="recommend-content"></div></td></tr>
        </table>

        <table>
            <tr><th class="th-left">장점 및 보완점</th></tr>
            <tr>
                <td>
                    <textarea id="improvement-area" data-print="print-improvement" placeholder="학생의 강점과 구체적인 보완 로드맵을 작성하세요."></textarea>
                    <div id="print-improvement" class="print-text-area"></div>
                </td>
            </tr>
        </table>

        <table>
            <tr><th class="th-left">원장님 총평</th></tr>
            <tr>
                <td>
                    <textarea id="comment-area" data-print="print-comment" placeholder="입시 전략 및 최종 의견을 작성하세요."></textarea>
                    <div id="print-comment" class="print-text-area"></div>
                </td>
            </tr>
        </table>
        <div class="academy-sign">경희실용음악학원</div>
    </div>

    <div class="button-group no-print">
        <button type="button" id="back-btn">목록으로</button>
        <button type="button" id="save-only-btn">💾 수정 내용 저장</button>
        <button type="button" id="save-print-btn">🖨️ 저장 후 리포트 인쇄</button>
    </div>
</div>

<script type="module">
import { requireAuth } from './assets/js/firebase.js';
import { getReport, createReport, updateReport, listReportsByMajor } from './assets/js/reports.js';
import { getFields, ARTISTS } from './assets/js/fields.js';
import { calcAverage, loadDraft, clearDraft } from './assets/js/utils.js';

await requireAuth();

const $ = id => document.getElementById(id);

// 저장 전(새 리포트)에는 null, 첫 저장 이후 또는 ?id= 로 열었을 때는 문서 id
let reportId = new URLSearchParams(location.search).get('id');
let report = null;

const SAVE_LABEL = "💾 수정 내용 저장";
const PRINT_LABEL = "🖨️ 저장 후 리포트 인쇄";

main();

async function main() {
    try {
        report = await loadReport();
    } catch (err) {
        alert("리포트를 불러오지 못했습니다: " + err.message);
        return;
    }
    if (!report) return;

    render(report);
    renderMajorAverage(report);
}

// ?id= 가 있으면 DB에서, 없으면 방금 입력한 임시 데이터에서 불러옴
async function loadReport() {
    if (reportId) {
        const data = await getReport(reportId);
        if (!data) {
            alert("리포트를 찾을 수 없습니다. 목록으로 이동합니다.");
            location.replace("admin.html");
        }
        return data;
    }

    const draft = loadDraft();
    if (!draft?.scores) {
        alert("입력된 테스트 데이터가 없습니다. 첫 페이지로 이동합니다.");
        location.replace("index.html");
        return null;
    }
    return {
        name: draft.name,
        age: draft.age,
        major: draft.major,
        analysis_date: draft.date,
        target_school: draft.targetSchool,
        scores: draft.scores,
        improvement: "",
        final_comment: ""
    };
}

function render(r) {
    $('disp-name').value = r.name ?? "";
    $('disp-major').value = r.major ?? "";
    $('disp-age').value = r.age ?? "";
    $('disp-date').value = r.analysis_date ?? "";
    $('target-school').value = r.target_school ?? "";
    $('improvement-area').value = r.improvement ?? "";
    $('comment-area').value = r.final_comment ?? "";
    document.querySelectorAll('textarea[data-print]').forEach(syncPrintText);

    const fields = getFields(r.major);
    const values = fields.map(f => Number(r.scores?.[f.key]) || 0);

    fields.forEach((f, idx) => {
        const th = document.createElement("th");
        th.textContent = f.label;
        $('score-header').appendChild(th);
        const td = document.createElement("td");
        td.textContent = values[idx];
        $('score-row').appendChild(td);
    });

    $('avg').textContent = calcAverage(r.scores, fields).toFixed(1);

    drawRadar('myChart', fields.map(f => f.label), values,
        { backgroundColor: "rgba(52,152,219,0.15)", borderColor: "#3498db", borderWidth: 2 });

    (ARTISTS[r.major] || []).forEach(name => {
        const tag = document.createElement("span");
        tag.className = "artist-tag";
        tag.textContent = `# ${name}`;
        $('recommend-content').appendChild(tag);
    });
}

// 같은 전공으로 저장된 다른 학생들의 항목별 평균
async function renderMajorAverage(r) {
    const fields = getFields(r.major);
    let averages = [];
    try {
        const others = (await listReportsByMajor(r.major)).filter(o => o.id !== reportId);
        $('avg-title').textContent = others.length
            ? `[ ${r.major} 전공 평균 · ${others.length}명 ]`
            : `[ ${r.major} 전공 평균 · 데이터 없음 ]`;
        if (others.length) {
            averages = fields.map(f => {
                const sum = others.reduce((acc, o) => acc + (Number(o.scores?.[f.key]) || 0), 0);
                return Math.round((sum / others.length) * 10) / 10;
            });
        }
    } catch (err) {
        console.error(err);
        $('avg-title').textContent = "[ 전공 평균 · 불러오기 실패 ]";
    }
    drawRadar('avgChart', fields.map(f => f.label), averages,
        { backgroundColor: "rgba(44, 62, 80, 0.05)", borderColor: "#2c3e50", borderWidth: 1, borderDash: [5, 5] });
}

function drawRadar(canvasId, labels, data, style) {
    new Chart($(canvasId), {
        type: 'radar',
        data: { labels, datasets: [{ data, pointRadius: 0, ...style }] },
        options: {
            scales: { r: { beginAtZero: true, max: 100, ticks: { display: false } } },
            plugins: { legend: { display: false } },
            animation: false
        }
    });
}

function syncPrintText(textarea) {
    $(textarea.dataset.print).textContent = textarea.value;
}

document.querySelectorAll('textarea[data-print]').forEach(t =>
    t.addEventListener('input', () => syncPrintText(t)));

async function save() {
    const fields = getFields(report.major);
    const data = {
        name: report.name ?? "",
        age: report.age ?? "",
        major: report.major ?? "",
        analysis_date: report.analysis_date ?? "",
        target_school: report.target_school ?? "",
        scores: report.scores ?? {},
        improvement: $('improvement-area').value,
        final_comment: $('comment-area').value,
        average_score: calcAverage(report.scores, fields)
    };

    if (reportId) {
        await updateReport(reportId, data);
    } else {
        // 첫 저장: 이후 저장은 같은 문서를 수정하도록 id를 주소에 기록 (새로고침해도 중복 생성 안 됨)
        reportId = await createReport(data);
        history.replaceState(null, "", `?id=${encodeURIComponent(reportId)}`);
        clearDraft();
    }
}

function setBusy(busy, activeBtn) {
    $('save-only-btn').disabled = busy;
    $('save-print-btn').disabled = busy;
    $('save-only-btn').textContent = SAVE_LABEL;
    $('save-print-btn').textContent = PRINT_LABEL;
    if (busy) activeBtn.textContent = "저장 중...";
}

$('save-only-btn').addEventListener('click', async e => {
    if (!report) return;
    setBusy(true, e.currentTarget);
    try {
        await save();
        setBusy(false);
        alert("데이터가 성공적으로 저장되었습니다.");
    } catch (err) {
        setBusy(false);
        alert("저장 실패: " + err.message);
    }
});

$('save-print-btn').addEventListener('click', async e => {
    if (!report) return;
    setBusy(true, e.currentTarget);
    try {
        await save();
        setBusy(false);
        window.print();
    } catch (err) {
        setBusy(false);
        alert("저장 실패: " + err.message);
    }
});

$('back-btn').addEventListener('click', () => location.href = 'admin.html');
</script>
</body>
</html>
